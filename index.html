<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Quotes Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gradient-start: #667eea;
            --gradient-end: #f093fb;
            --coral: #ff6b6b;
            --teal: #4ecdc4;
            --yellow: #ffe66d;
            --mint: #95e1d3;
            --salmon: #f38181;
            --lavender: #aa96da;
            --pink: #fcbad3;
            --sky-blue: #a8d8ea;
        }

        body {
            font-family: 'Merriweather', serif;
            background-color: #f0e6d3;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: #333;
            min-height: 100vh;
            line-height: 1.7;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            padding: 60px 40px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.3);
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: float 15s ease-in-out infinite;
        }

        header::after {
            content: '✦';
            position: absolute;
            top: 20px;
            left: 30px;
            font-size: 2rem;
            color: rgba(255,255,255,0.5);
            animation: sparkle 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(30px, 30px) rotate(180deg); }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }

        .header-decoration {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
        }

        .header-decoration:nth-child(1) {
            width: 100px;
            height: 100px;
            top: -30px;
            right: 10%;
            animation: pulse 4s ease-in-out infinite;
        }

        .header-decoration:nth-child(2) {
            width: 60px;
            height: 60px;
            bottom: 10px;
            left: 5%;
            animation: pulse 4s ease-in-out infinite 1s;
        }

        .header-decoration:nth-child(3) {
            width: 40px;
            height: 40px;
            top: 40%;
            right: 3%;
            animation: pulse 4s ease-in-out infinite 2s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.5; }
        }

        .header-floating-titles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .header-floating-title {
            position: absolute;
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            opacity: 0;
            animation: headerFloatUp 8s ease-out forwards;
            white-space: nowrap;
            pointer-events: none;
            bottom: 0;
        }

        .header-floating-title.down {
            animation-name: headerFloatDown;
        }

        @keyframes headerFloatUp {
            0% {
                opacity: 0;
                transform: translateY(50px) rotate(var(--rotation));
            }
            10% {
                opacity: 0.35;
            }
            90% {
                opacity: 0.35;
            }
            100% {
                opacity: 0;
                transform: translateY(-150px) rotate(var(--rotation));
            }
        }

        @keyframes headerFloatDown {
            0% {
                opacity: 0;
                transform: translateY(-50px) rotate(var(--rotation));
            }
            10% {
                opacity: 0.35;
            }
            90% {
                opacity: 0.35;
            }
            100% {
                opacity: 0;
                transform: translateY(150px) rotate(var(--rotation));
            }
        }

        .floating-titles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .floating-title {
            position: absolute;
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            opacity: 0;
            animation: floatUp 10s ease-out forwards;
            white-space: nowrap;
            pointer-events: none;
        }

        .floating-title.down {
            animation-name: floatDown;
        }

        .second-row-title {
            position: fixed;
            top: 22%;
            left: 50%;
            transform: translate(-50%, 0);
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: 2rem;
            opacity: 0.2;
            color: var(--coral);
            pointer-events: none;
            z-index: 0;
            animation: gentleFloat 5s ease-in-out infinite;
            white-space: nowrap;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translate(-50%, 0) rotate(-1deg); }
            50% { transform: translate(-50%, -5px) rotate(1deg); }
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(100px) rotate(var(--rotation));
            }
            10% {
                opacity: var(--max-opacity);
            }
            90% {
                opacity: var(--max-opacity);
            }
            100% {
                opacity: 0;
                transform: translateY(-200px) rotate(var(--rotation));
            }
        }

        @keyframes floatDown {
            0% {
                opacity: 0;
                transform: translateY(-100px) rotate(var(--rotation));
            }
            10% {
                opacity: var(--max-opacity);
            }
            90% {
                opacity: var(--max-opacity);
            }
            100% {
                opacity: 0;
                transform: translateY(200px) rotate(var(--rotation));
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 2px 4px 20px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1;
        }

        .subtitle {
            font-family: 'Merriweather', serif;
            font-size: 1.1rem;
            color: rgba(255,255,255,0.9);
            font-style: italic;
            position: relative;
            z-index: 1;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .search-box {
            flex: 1;
            min-width: 280px;
            max-width: 400px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px;
            font-family: 'Merriweather', serif;
            font-size: 1rem;
            border: 2px solid #e8e2dc;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--lavender);
            box-shadow: 0 0 0 4px rgba(170, 150, 218, 0.2);
        }

        .search-box input::placeholder {
            color: #999;
        }

        .lang-selector {
            display: flex;
            gap: 0;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #e8e2dc;
        }

        .lang-selector button {
            padding: 14px 20px;
            font-family: 'Merriweather', serif;
            font-size: 0.95rem;
            border: none;
            background: white;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-selector button:not(:last-child) {
            border-right: 1px solid #e8e2dc;
        }

        .lang-selector button:hover {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: white;
        }

        .lang-selector button.active {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: white;
        }

        .refresh-btn {
            padding: 14px 28px;
            font-family: 'Merriweather', serif;
            font-size: 1rem;
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .refresh-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .refresh-btn svg {
            transition: transform 0.5s ease;
        }

        .refresh-btn:hover svg {
            transform: rotate(180deg);
        }

        .book-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .book-tag {
            padding: 8px 16px;
            background: white;
            border: 2px solid transparent;
            border-radius: 25px;
            font-size: 0.85rem;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .book-tag:nth-child(6n+1):hover { border-color: var(--coral); background: var(--coral); color: white; }
        .book-tag:nth-child(6n+2):hover { border-color: var(--teal); background: var(--teal); color: white; }
        .book-tag:nth-child(6n+3):hover { border-color: var(--yellow); background: var(--yellow); color: #333; }
        .book-tag:nth-child(6n+4):hover { border-color: var(--mint); background: var(--mint); color: #333; }
        .book-tag:nth-child(6n+5):hover { border-color: var(--salmon); background: var(--salmon); color: white; }
        .book-tag:nth-child(6n+6):hover { border-color: var(--lavender); background: var(--lavender); color: white; }

        .quotes-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .quotes-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .quote-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            border-left: 6px solid;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: translateY(20px);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .quote-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.8) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .quote-card:nth-child(8n+1) { border-left-color: var(--coral); }
        .quote-card:nth-child(8n+2) { border-left-color: var(--teal); }
        .quote-card:nth-child(8n+3) { border-left-color: var(--yellow); }
        .quote-card:nth-child(8n+4) { border-left-color: var(--mint); }
        .quote-card:nth-child(8n+5) { border-left-color: var(--salmon); }
        .quote-card:nth-child(8n+6) { border-left-color: var(--lavender); }
        .quote-card:nth-child(8n+7) { border-left-color: var(--pink); }
        .quote-card:nth-child(8n+8) { border-left-color: var(--sky-blue); }

        .quote-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .quote-card:hover {
            transform: translateY(-8px) scale(1.02);
        }

        .quote-card:nth-child(8n+1):hover { box-shadow: 0 15px 40px rgba(255, 107, 107, 0.3); }
        .quote-card:nth-child(8n+2):hover { box-shadow: 0 15px 40px rgba(78, 205, 196, 0.3); }
        .quote-card:nth-child(8n+3):hover { box-shadow: 0 15px 40px rgba(255, 230, 109, 0.3); }
        .quote-card:nth-child(8n+4):hover { box-shadow: 0 15px 40px rgba(149, 225, 211, 0.3); }
        .quote-card:nth-child(8n+5):hover { box-shadow: 0 15px 40px rgba(243, 129, 129, 0.3); }
        .quote-card:nth-child(8n+6):hover { box-shadow: 0 15px 40px rgba(170, 150, 218, 0.3); }
        .quote-card:nth-child(8n+7):hover { box-shadow: 0 15px 40px rgba(252, 186, 211, 0.3); }
        .quote-card:nth-child(8n+8):hover { box-shadow: 0 15px 40px rgba(168, 216, 234, 0.3); }

        .quote-card:hover::before {
            opacity: 1;
        }

        .quote-text {
            font-family: 'Merriweather', serif;
            font-size: 1.05rem;
            font-style: italic;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.8;
            position: relative;
        }

        .quote-text::before {
            content: '"';
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            position: absolute;
            top: -25px;
            left: -5px;
            opacity: 0.2;
        }

        .quote-card:nth-child(8n+1) .quote-text::before { color: var(--coral); }
        .quote-card:nth-child(8n+2) .quote-text::before { color: var(--teal); }
        .quote-card:nth-child(8n+3) .quote-text::before { color: var(--yellow); }
        .quote-card:nth-child(8n+4) .quote-text::before { color: var(--mint); }
        .quote-card:nth-child(8n+5) .quote-text::before { color: var(--salmon); }
        .quote-card:nth-child(8n+6) .quote-text::before { color: var(--lavender); }
        .quote-card:nth-child(8n+7) .quote-text::before { color: var(--pink); }
        .quote-card:nth-child(8n+8) .quote-text::before { color: var(--sky-blue); }

        .quote-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #f0ebe5;
        }

        .quote-book {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            color: #2c2c2c;
            font-size: 0.95rem;
        }

        .quote-author {
            font-size: 0.85rem;
            color: #888;
        }

        .click-hint {
            font-size: 0.75rem;
            color: var(--lavender);
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .quote-card:hover .click-hint {
            opacity: 1;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #e8e2dc;
            border-top-color: var(--gradient-start);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            font-style: italic;
            color: #888;
        }

        .error {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 16px;
        }

        .error h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #2c2c2c;
            margin-bottom: 10px;
        }

        .error p {
            color: #888;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
        }

        .no-results h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #2c2c2c;
            margin-bottom: 10px;
        }

        .no-results p {
            color: #888;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 30px;
            color: #999;
            font-size: 0.9rem;
        }

        footer a {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .postcard {
            width: 600px;
            max-width: 95vw;
            height: 400px;
            max-height: 90vh;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
        }

        .modal-overlay.active .postcard {
            transform: scale(1);
        }

        .postcard:nth-child(1) .postcard-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%); }
        .postcard:nth-child(2) .postcard-bg { background: linear-gradient(135deg, #ff6b6b 0%, #feca57 50%, #ff9ff3 100%); }
        .postcard:nth-child(3) .postcard-bg { background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 50%, #96e6a1 100%); }
        .postcard:nth-child(4) .postcard-bg { background: linear-gradient(135deg, #f38181 0%, #fce38a 50%, #f38181 100%); }
        .postcard:nth-child(5) .postcard-bg { background: linear-gradient(135deg, #aa96da 0%, #fcbad3 50%, #a8d8ea 100%); }
        .postcard:nth-child(6) .postcard-bg { background: linear-gradient(135deg, #ffe66d 0%, #ff6b6b 50%, #4ecdc4 100%); }
        .postcard:nth-child(7) .postcard-bg { background: linear-gradient(135deg, #95e1d3 0%, #f093fb 50%, #667eea 100%); }
        .postcard:nth-child(8) .postcard-bg { background: linear-gradient(135deg, #a8d8ea 0%, #aa96da 50%, #fcbad3 100%); }
        .postcard:nth-child(9) .postcard-bg { background: linear-gradient(135deg, #f093fb 0%, #667eea 50%, #4ecdc4 100%); }
        .postcard:nth-child(10) .postcard-bg { background: linear-gradient(135deg, #ff6b6b 0%, #aa96da 50%, #ffe66d 100%); }

        .postcard-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .postcard-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0.15;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255,255,255,0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255,255,255,0.2) 0%, transparent 30%),
                radial-gradient(circle at 60% 60%, rgba(255,255,255,0.2) 0%, transparent 30%);
        }

        .postcard-content {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .postcard-quote {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-style: italic;
            color: white;
            text-shadow: 2px 4px 20px rgba(0,0,0,0.3);
            line-height: 1.5;
            margin-bottom: 30px;
            max-width: 90%;
        }

        .postcard-info {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
        }

        .postcard-book {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            text-shadow: 1px 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 5px;
        }

        .postcard-author {
            font-family: 'Merriweather', serif;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.85);
            text-shadow: 1px 2px 10px rgba(0,0,0,0.2);
        }

        .postcard-corner {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255,255,255,0.3);
        }

        .postcard-corner.top-left {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
            border-top-left-radius: 10px;
        }

        .postcard-corner.top-right {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
            border-top-right-radius: 10px;
        }

        .postcard-corner.bottom-left {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
            border-bottom-left-radius: 10px;
        }

        .postcard-corner.bottom-right {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
            border-bottom-right-radius: 10px;
        }

        .postcard-stamp {
            position: absolute;
            top: 30px;
            right: 80px;
            width: 50px;
            height: 60px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            transform: rotate(15deg);
        }

        .postcard-buttons {
            position: absolute;
            bottom: -60px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .postcard-btn {
            padding: 12px 30px;
            font-family: 'Merriweather', serif;
            font-size: 1rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;

                            book: book,
                            author: quotesDB[book].author
                        })));
                    });
                }

                if (quotes.length === 0) {
                    container.innerHTML = `
                        <div class="error">
                            <h3>No quotes found</h3>
                            <p>Try searching for a different book title or select a book from the list.</p>
                        </div>
                    `;
                    return;
                }

                quotes = shuffleArray(quotes).slice(0, 10);

                if (!refresh) {
                    displayedQuotes = quotes;
                } else {
                    displayedQuotes = quotes;
                }

                container.innerHTML = `
                    <div class="quotes-grid">
                        ${displayedQuotes.map((quote, index) => `
                            <div class="quote-card" style="animation-delay: ${index * 100}ms" onclick="openPostcard(${index})">
                                <p class="quote-text">${quote.text}</p>
                                <div class="quote-meta">
                                    <span class="quote-book">${quote.book}</span>
                                    <span class="quote-author">— ${quote.author}</span>
                                </div>
                                <p class="click-hint">Click to create postcard</p>
                            </div>
                        `).join('')}
                    </div>
                `;

                setTimeout(() => {
                    document.querySelectorAll('.quote-card').forEach((card, index) => {
                        setTimeout(() => {
                            card.classList.add('visible');
                        }, index * 100);
                    });
                }, 100);

            }, 500);
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function openPostcard(index) {
            const quote = displayedQuotes[index];
            document.getElementById('postcardQuote').textContent = quote.text;

            const bookTitle = bookTitlesDB[quote.book] ? bookTitlesDB[quote.book][currentLanguage] : quote.book;
            document.getElementById('postcardBook').textContent = bookTitle;
            document.getElementById('postcardAuthor').textContent = '— ' + quote.author;

            const buttonTexts = {
                cn: { close: '关闭', download: '下载' },
                en: { close: 'Close', download: 'Download' },
                fr: { close: 'Fermer', download: 'Télécharger' }
            };
            document.getElementById('postcardCloseBtn').textContent = buttonTexts[currentLanguage].close;
            document.getElementById('postcardDownloadBtn').textContent = buttonTexts[currentLanguage].download;
            
            const postcard = document.getElementById('postcard');
            const colors = [
                'linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%)',
                'linear-gradient(135deg, #ff6b6b 0%, #feca57 50%, #ff9ff3 100%)',
                'linear-gradient(135deg, #4ecdc4 0%, #44a08d 50%, #96e6a1 100%)',
                'linear-gradient(135deg, #f38181 0%, #fce38a 50%, #f38181 100%)',
                'linear-gradient(135deg, #aa96da 0%, #fcbad3 50%, #a8d8ea 100%)',
                'linear-gradient(135deg, #ffe66d 0%, #ff6b6b 50%, #4ecdc4 100%)',
                'linear-gradient(135deg, #95e1d3 0%, #f093fb 50%, #667eea 100%)',
                'linear-gradient(135deg, #a8d8ea 0%, #aa96da 50%, #fcbad3 100%)',
                'linear-gradient(135deg, #f093fb 0%, #667eea 50%, #4ecdc4 100%)',
                'linear-gradient(135deg, #ff6b6b 0%, #aa96da 50%, #ffe66d 100%)'
            ];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            postcard.querySelector('.postcard-bg').style.background = randomColor;
            
            document.getElementById('postcardModal').classList.add('active');
        }

        function closeModal(event) {
            if (event.target.id === 'postcardModal' || event.target.classList.contains('close')) {
                document.getElementById('postcardModal').classList.remove('active');
            }
        }

        function downloadPostcard() {
            alert('Save image feature coming soon!');
        }

        function createFloatingTitle() {
            const container = document.getElementById('floatingTitles');
            if (!container) return;

            const titles = floatingTitlesDB[currentLanguage];
            const title = titles[Math.floor(Math.random() * titles.length)];
            
            const element = document.createElement('div');
            const direction = Math.random() > 0.5 ? 'up' : 'down';
            element.className = 'floating-title' + (direction === 'down' ? ' down' : '');
            element.textContent = title;
            
            const leftPercent = Math.random() * 95;
            const fontSize = Math.random() * 4 + 3;
            const rotation = Math.random() * 30 - 15;
            const maxOpacity = Math.random() * 0.3 + 0.3;
            const color = floatingColors[Math.floor(Math.random() * floatingColors.length)];
            
            element.style.left = leftPercent + '%';
            element.style.bottom = direction === 'up' ? '0px' : 'auto';
            element.style.top = direction === 'down' ? '0px' : 'auto';
            element.style.fontSize = fontSize + 'rem';
            element.style.setProperty('--rotation', rotation + 'deg');
            element.style.setProperty('--max-opacity', maxOpacity);
            element.style.color = color;
            
            container.appendChild(element);
            
            setTimeout(() => {
                if (element.parentNode) {
                    element.parentNode.removeChild(element);
                }
            }, 10000);
        }

        function startFloatingTitles() {
            createFloatingTitle();
            createFloatingTitle();
            createFloatingTitle();
            
            floatingInterval = setInterval(() => {
                const timeSinceLanguageChange = Date.now() - lastLanguageChange;
                const interval = timeSinceLanguageChange < 2000 ? 300 : 800;
                
                createFloatingTitle();
            }, 800);
        }

        function createHeaderFloatingTitle() {
            const container = document.getElementById('headerFloatingTitles');
            if (!container) return;

            const titles = headerFloatingTitlesDB[currentLanguage];
            const title = titles[Math.floor(Math.random() * titles.length)];
            
            const element = document.createElement('div');
            element.className = 'header-floating-title';
            element.textContent = title;
            
            const direction = Math.random() > 0.5 ? 'up' : 'down';
            if (direction === 'down') {
                element.className += ' down';
                element.style.top = '0px';
                element.style.bottom = 'auto';
            } else {
                element.style.bottom = '0px';
            }
            
            const leftPercent = Math.random() * 95;
            const fontSize = Math.random() * 3 + 2;
            const rotation = Math.random() * 20 - 10;
            
            element.style.left = leftPercent + '%';
            element.style.fontSize = fontSize + 'rem';
            element.style.setProperty('--rotation', rotation + 'deg');
            element.style.color = headerFloatingColors[Math.floor(Math.random() * headerFloatingColors.length)];
            
            container.appendChild(element);
            
            setTimeout(() => {
                if (element.parentNode) {
                    element.parentNode.removeChild(element);
                }
            }, 8000);
        }

        function startHeaderFloatingTitles() {
            for (let i = 0; i < 6; i++) {
                setTimeout(() => createHeaderFloatingTitle(), i * 300);
            }
            setInterval(() => createHeaderFloatingTitle(), 1000);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('postcardModal').classList.remove('active');
            }
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
